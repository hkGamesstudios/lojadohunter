<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App dos Hunters - Loja do Hunter</title>

    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        /* Container formato celular idêntico ao da imagem */
        .mobile-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }

        /* Faixa Laranja Superior */
        .top-bar {
            width: 100%;
            background: #FF6B00;
            padding: 16px 12px 14px 12px;
            box-shadow: 0 2px 8px rgba(255, 107, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .top-bar span {
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }

        /* Área Central */
        .content-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 320px;
            padding: 0 1.5rem;
            margin-top: auto;
            margin-bottom: auto;
        }

        /* Ícone central gradiente idêntico */
        .icon-box {
            width: 82px;
            height: 82px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-box svg {
            width: 100%;
            height: 100%;
        }

        .welcome-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #2D2319;
            margin: 0;
            line-height: 1.3;
        }

        /* Botão Entrar idêntico */
        .btn-enter {
            width: 100%;
            padding: 13px;
            background: #FF6B00;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255, 107, 0, 0.3);
            text-decoration: none;
            display: block;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .btn-enter:active {
            transform: scale(0.97);
            background: #e65100;
        }

        .info-text {
            font-size: 0.72rem;
            color: #7a7a7a;
            line-height: 1.45;
            margin: 0;
            padding: 0 10px;
        }

        /* Rodapé idêntico */
        .footer-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding-bottom: 24px;
            flex-shrink: 0;
        }

        .footer-logo {
            font-size: 1.6rem;
            font-weight: 900;
            color: #FF6B00;
            letter-spacing: -0.5px;
        }

        .footer-version {
            font-size: 0.65rem;
            color: #a0a0a0;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="mobile-screen">
        <!-- Faixa Laranja Topo -->
        <div class="top-bar">
            <span>App dos Hunters</span>
        </div>

        <!-- Conteúdo do Meio -->
        <div class="content-center">
            <div class="icon-box">
                <svg viewBox="0 0 100 100">
                    <circle cx="50" cy="28" r="16" fill="none" stroke="url(#hunterWelcomeGrad)" stroke-width="5"/>
                    <path d="M 22 84 C 22 55, 78 55, 78 84" fill="none" stroke="url(#hunterWelcomeGrad)" stroke-width="5" stroke-linecap="round"/>
                    <polygon points="50,44 54,62 50,78 46,62" fill="url(#hunterWelcomeGrad)"/>
                    <defs>
                        <linearGradient id="hunterWelcomeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FF9F43"/>
                            <stop offset="50%" stop-color="#FF6B00"/>
                            <stop offset="100%" stop-color="#D35400"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <h2 class="welcome-title">Bem-vindo ao<br>App dos Hunters!</h2>

            <a href="http://lojadohuntercolaborador.shop/" class="btn-enter" id="btn-entrar">Entrar</a>

            <p class="info-text">Você será redirecionado para a tela de identificação. Basta digitar sua filial, usuário e senha.</p>
        </div>

        <!-- Rodapé -->
        <div class="footer-brand">
            <span class="footer-logo">Loja do Hunter</span>
            <span class="footer-version">Versão 10.2.0 - A</span>
        </div>
    </div>

    <script>
        const targetUrl = "http://lojadohuntercolaborador.shop/";
        const btn = document.getElementById('btn-entrar');

        btn.addEventListener('click', function(e) {
            e.preventDefault();
            btn.textContent = 'Carregando...';
            btn.style.opacity = '0.85';
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 200);
        });
    </script>

</body>
</html>
